name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app.py config.py run_pipeline.py src tests
      - name: Unit + API tests
        run: pytest -q
      - name: Pipeline smoke test on synthetic data
        run: |
          python scripts/make_sample_data.py --rows 20000
          python run_pipeline.py --data data/sample_loans.csv --skip-save

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t credit-risk-scoring .
